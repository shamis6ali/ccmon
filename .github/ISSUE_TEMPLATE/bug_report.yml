name: Bug report
description: Something behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here.** Use
        [private vulnerability reporting](../../security/advisories/new) —
        see [SECURITY.md](../../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ccmon reindex --force
        2. ccmon report --since=monday
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: ccmon doctor
      description: >
        Output of `ccmon doctor`. It prints the paths and retention settings
        that explain most reports. **Redact anything you would rather not
        publish** — it includes filesystem paths.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "ccmon 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows]
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [CLI, Desktop app, Both]
    validations:
      required: true
