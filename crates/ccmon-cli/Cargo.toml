[package]
name = "ccmon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for ccmon."

[[bin]]
name = "ccmon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ccmon-core = { version = "0.1.0", path = "../ccmon-core" }
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
